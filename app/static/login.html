<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clearline · Seller login</title>
  <link rel="preload" href="/static/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/ui.css" />
  <script src="/static/ui.js"></script>
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px var(--gutter); }
    .wrap { width: min(380px, 100%); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    form { padding: 28px 24px; }
    h1 { font-size: var(--t-xl); margin-bottom: 4px; }
    .sub { color: var(--muted); margin: 0 0 8px; }
    input { width: 100%; }
    button[type="submit"] { width: 100%; margin-top: 18px; }
    #msg { color: var(--disputed-ink); font-size: var(--t-sm); min-height: 1.5em; margin-top: 10px; }
  </style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="top"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>Clearline</span>
      <button class="ghost small" type="button" data-theme-toggle aria-pressed="false">Theme</button></div>
    <form class="panel" id="login" novalidate>
      <h1>Seller login</h1>
      <p class="sub">Your orders, disputes and invoices.</p>
      <label class="field" for="email">Email
        <input id="email" name="email" type="email" autocomplete="username" required autofocus maxlength="254" /></label>
      <label class="field" for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" /></label>
      <button type="submit">Log in</button>
      <div id="msg" role="alert"></div>
    </form>
  </div>
</main>
<script>
  document.getElementById("login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const form = ev.currentTarget, button = form.querySelector("button[type=submit]"), msg = document.getElementById("msg");
    const email = form.email.value.trim(), password = form.password.value;
    if (!email || !password) { msg.textContent = "Enter your email and password."; return; }
    button.disabled = true; button.textContent = "Logging in…"; msg.textContent = "";
    try {
      const res = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }),
      });
      if (res.ok) { location.href = "/seller"; return; }
      const body = await res.json().catch(() => ({}));
      msg.textContent = res.status === 429 ? "Too many attempts, try again later."
        : body.detail && typeof body.detail === "string" ? body.detail : "Email or password is incorrect.";
      form.password.value = ""; form.password.focus();
    } catch { msg.textContent = "Could not reach the server."; }
    finally { button.disabled = false; button.textContent = "Log in"; }
  });
</script>
</body>
</html>

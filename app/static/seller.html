<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearline · Seller</title>
  <style>
    :root { --ink:#14213d; --muted:#5c6475; --line:#e3e6ec; --bg:#f6f7f9; --ok:#1a7f4b; --bad:#b42318; --warn:#b54708; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width:760px; margin:40px auto; padding:0 16px; }
    header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 16px; }
    h1 { font-size:22px; margin:0; flex:1; }
    .order { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
    .id { font-family:ui-monospace, monospace; font-size:13px; }
    ol { margin:8px 0; padding-left:20px; font-size:14px; }
    .muted { color:var(--muted); font-size:13px; }
    form { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    input, select, button, textarea { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; }
    button { background:var(--ink); color:#fff; border:0; cursor:pointer; }
    button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button:disabled { opacity:.6; cursor:wait; }
    .msg { font-size:13px; margin-top:6px; }
    .badge { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
    .badge.bad { background:var(--bad); color:#fff; }
    .badge.neutral { background:var(--line); color:var(--muted); }
    .badge.fight { background:var(--ink); color:#fff; }
    .badge.refund { background:var(--warn); color:#fff; }
    .badge.offer { background:var(--ok); color:#fff; }
    .dispute { border:1px solid #f3c4bf; background:#fef3f2; border-radius:10px; padding:10px 12px; margin-top:8px; font-size:14px; }
    .dispute.resolved { border-color:var(--line); background:var(--bg); }
    .due { font-weight:600; color:var(--bad); }
    .order.disputed { border-color:#f3c4bf; }
    .ai { border:1px solid var(--line); background:#fbfcfe; border-radius:10px; padding:12px; margin-top:8px; font-size:14px; }
    .ai h3 { font-size:14px; margin:0 0 6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .ai ul { margin:4px 0 8px; padding-left:20px; }
    .ai label { display:block; font-size:13px; font-weight:600; margin-top:8px; }
    .ai textarea { width:100%; min-height:84px; resize:vertical; }
    .ai .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .ai.compact { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 12px; color:var(--muted); }
    .ai.compact .msg { flex-basis:100%; margin:0; }
    button.sandbox { background:#fffaeb; color:#93370d; border:1px dashed #f79009; font-size:13px; }
    .sandbox-tool { margin-top:8px; }
    details.tech, details.earlier { display:inline; margin-left:6px; }
    details.tech summary, details.earlier summary { display:inline; cursor:pointer; color:var(--muted); font-size:12px; }
    details.tech[open] { display:block; font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
    details.earlier ul { margin:4px 0; padding-left:18px; }
    .stats { background:#effaf3; border:1px solid #b7e1c8; color:var(--ok); border-radius:10px; padding:8px 12px; margin:0 0 12px; font-size:14px; }
    .stats strong { font-size:18px; }
    .buyer { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:14px; }
    .buyer h4 { margin:8px 0 4px; font-size:14px; }
    .buyer .req { border-top:1px solid var(--line); padding:8px 0; }
    .buyer .reply { background:#effaf3; border-radius:8px; padding:6px 8px; margin-top:4px; }
    .buyer textarea { width:100%; min-height:60px; margin-top:6px; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    #other h2 { font-size:15px; margin:28px 0 8px; color:var(--muted); }
    #other .order { padding:10px 12px; font-size:13px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Your orders</h1>
    <span id="sync-msg" class="muted"></span>
    <span id="sync-status" class="muted"></span>
    <button id="sync" class="secondary">Sync disputes</button>
    <button id="logout" class="secondary">Log out</button>
  </header>
  <div id="stats" class="stats" hidden></div>
  <div id="orders"><p class="muted">Loading…</p></div>
  <div id="other"></div>
</main>

<script>
  const LABELS = {
    order_created: "Order created",
    payment_captured: "Payment captured",
    capture_failed: "Capture failed",
    tracking_added: "Tracking added",
    dispute_created: "Dispute opened",
    dispute_updated: "Dispute updated",
    dispute_resolved: "Dispute resolved",
    webhook_payment_capture_completed: "PayPal: capture completed",
    webhook_payment_capture_pending: "PayPal: capture pending",
    webhook_payment_capture_refunded: "PayPal: refunded",
    webhook_payment_capture_reversed: "PayPal: reversed",
    webhook_other: "PayPal event",
    webhook_processing_failed: "Processing failed",
    ai_recommendation: "AI recommendation",
    ai_failed: "AI unavailable",
    ai_provider_switched: "AI provider switched",
    dispute_action_sent: "Sent to PayPal",
    dispute_action_failed: "PayPal rejected action",
    dispute_action_skipped: "Step skipped",
    sandbox_status_changed: "Sandbox: status changed",
    sandbox_status_change_failed: "Sandbox: status change failed",
    buyer_request: "Buyer asked",
    seller_reply: "You replied",
    refund_sent: "Refund sent",
    refund_failed: "Refund failed",
  };
  const STEP_NAMES = { "provide-evidence": "Evidence", "send-message": "Message", "make-offer": "Offer", "accept-claim": "Refund" };
  const DISPUTE_KINDS = ["dispute_created", "dispute_updated", "dispute_resolved"];
  const DECISIONS = { FIGHT: "Fight", REFUND: "Refund", OFFER: "Offer" };
  // PayPal dispute reason codes in plain words.
  const REASONS = {
    MERCHANDISE_OR_SERVICE_NOT_RECEIVED: "Item not received",
    MERCHANDISE_OR_SERVICE_NOT_AS_DESCRIBED: "Item not as described",
    UNAUTHORISED: "Unauthorised payment",
    CREDIT_NOT_PROCESSED: "Refund not processed",
    DUPLICATE_TRANSACTION: "Charged twice",
    INCORRECT_AMOUNT: "Wrong amount charged",
    PAYMENT_BY_OTHER_MEANS: "Paid by other means",
    CANCELED_RECURRING_BILLING: "Cancelled subscription still billed",
    PROBLEM_WITH_REMITTANCE: "Problem with remittance",
    OTHER: "Other",
  };
  const humanize = (code) => REASONS[code] || String(code || "Unknown").toLowerCase().replace(/_/g, " ");
  const money = (a) => (a && a.value ? `${a.value} ${a.currency_code || ""}`.trim() : "");
  const fmt = (t) => new Date(t * 1000).toLocaleString();
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  let busy = 0; // requests in flight from our buttons; auto-refresh waits for them
  let ENV = null; // "sandbox" or "live", from /api/config; sandbox-only tools need "sandbox"
  const BUYER_TYPES = { unrecognised: "Doesn't recognise the charge", not_arrived: "Order hasn't arrived", refund: "Wants a refund" };

  // Session expired or logged out elsewhere: any 401 from a seller API goes to the login page.
  const rawFetch = globalThis.fetch;
  globalThis.fetch = async (...args) => {
    const res = await rawFetch(...args);
    if (res.status === 401) location.href = "/login";
    return res;
  };

  // The server stores PayPal failures as a short sentence plus issue/debug_id. Rows from
  // before that hold PayPal's raw error text, so pull the same facts out of it.
  const LEGACY_ISSUES = {
    ACTION_NOT_ALLOWED_IN_CURRENT_DISPUTE_STATE: "PayPal didn't allow this step in the dispute's current state",
    EVIDENCE_TYPE_IS_NOT_ALLOWED: "PayPal won't accept this kind of evidence at this stage. Attach a document and choose the matching type.",
  };
  function errorParts(p, field = "error") {
    const raw = String(p[field] || "");
    const legacy = raw.includes("PayPal API error");
    const issue = p.paypal_issue || (raw.match(/'issue': '([A-Z_]+)'/) || [])[1];
    const debug = p.debug_id || (raw.match(/'debug_id': '([\w-]+)'/) || [])[1];
    const status = p.paypal_status || (raw.match(/PayPal API error (\d+)/) || [])[1];
    // Rows stored before an issue had its own sentence still show the plain-words version.
    const text = LEGACY_ISSUES[issue] || (legacy ? "PayPal rejected this step" : raw);
    // Full PayPal error (stored since "Store PayPal's full error details"): a header line,
    // then one line per details[] entry. Older rows only have status/issue/debug_id.
    const e = p.paypal_error;
    const tech = e
      ? [[e.http_status && `HTTP ${e.http_status}`, e.name, e.message, e.debug_id && `debug_id ${e.debug_id}`].filter(Boolean).join(" · "),
         ...(e.details || []).map((d) => [d.issue, d.field && `field ${d.field}`, d.value != null && `value ${d.value}`,
                                           d.location && `location ${d.location}`, d.description].filter(Boolean).join(" · "))]
      : [[status && `HTTP ${status}`, issue && `issue ${issue}`, debug && `debug_id ${debug}`].filter(Boolean).join(" · ")];
    return { text, tech: tech.filter(Boolean) };
  }
  const techHtml = (lines) => lines.length
    ? `<details class="tech"><summary>details</summary>${lines.map((l) => `<div>${esc(l)}</div>`).join("")}</details>` : "";
  function errorHtml(p, field = "error") {
    const { text, tech } = errorParts(p, field);
    return esc(text) + techHtml(tech);
  }

  function describe(e) {
    const p = e.payload;
    if (e.kind === "order_created") return `${p.amount} ${p.currency}`;
    if (e.kind === "payment_captured") return `from ${p.payer_email || "buyer"} (${p.payer_country || "?"})`;
    if (e.kind === "tracking_added") return `${p.carrier} ${p.tracking_number}`;
    if (DISPUTE_KINDS.includes(e.kind)) return [humanize(p.reason), money(p.dispute_amount), p.status].filter(Boolean).join(" · ");
    if (e.kind.startsWith("webhook_payment_capture")) return [p.status, money(p.amount), p.pending_reason].filter(Boolean).join(" · ");
    if (e.kind === "webhook_other") return p.event_type;
    if (e.kind === "ai_recommendation") return `${DECISIONS[p.recommendation?.decision] || "?"} · ${p.provider} ${p.model}${p.trigger ? ` · ${p.trigger}` : ""}`;
    if (e.kind === "ai_failed") return p.error;
    if (e.kind === "ai_provider_switched") return `${p.from} → ${p.to}: ${p.reason}`;
    if (e.kind === "dispute_action_sent") return `${p.action}: ${p.endpoint}`;
    if (e.kind === "dispute_action_failed") return `${p.action}: ${p.endpoint} · ${errorParts(p).text}`;
    if (e.kind === "dispute_action_skipped") return `${p.action}: ${p.endpoint} · ${p.reason}`;
    if (e.kind === "sandbox_status_changed") return `${p.from_status} → asked seller for evidence`;
    if (e.kind === "sandbox_status_change_failed") return errorParts(p).text;
    if (e.kind === "buyer_request") return [BUYER_TYPES[p.type] || p.type, p.message].filter(Boolean).join(" · ");
    if (e.kind === "seller_reply") return p.message;
    if (e.kind === "refund_sent") return `${p.amount} ${p.currency} (${p.mode})${p.status ? ` · ${p.status}` : ""}`;
    if (e.kind === "refund_failed") return `${p.amount} ${p.currency} · ${errorParts(p).text}`;
    return "";
  }

  function respondBy(due) {
    if (!due) return "";
    const date = new Date(due);
    if (isNaN(date)) return "";
    const days = Math.ceil((date - Date.now()) / 86400000);
    const left = days > 1 ? `${days} days left` : days === 1 ? "1 day left" : days === 0 ? "due today" : "overdue";
    return `<div class="due">Respond by ${esc(date.toLocaleDateString())} (${left})</div>`;
  }

  // Current dispute state = the event with the newest PayPal update_time, not the last row
  // inserted (webhooks can arrive out of order). Rows without update_time count as oldest.
  function currentDispute(events) {
    const states = events.filter((e) => DISPUTE_KINDS.includes(e.kind));
    const t = (e) => Date.parse(e.payload.update_time || "") || 0;
    return states.reduce((best, e) => (!best || t(e) >= t(best) ? e : best), null);
  }

  // Sandbox-only test tool for disputes PayPal is reviewing. Lives in the dispute panel, so it
  // doesn't depend on the AI card (UNDER_REVIEW disputes often have no recommendation, or
  // still allow a Refund, which shows the full card). Never rendered in live mode.
  function sandboxTool(state) {
    if (ENV !== "sandbox" || state?.payload.status !== "UNDER_REVIEW") return "";
    return `<div class="sandbox-tool"><button class="sandbox" data-sandbox="${esc(state.payload.dispute_id)}" title="Test tool: only exists in the PayPal Sandbox">Sandbox: simulate PayPal asking the seller for evidence</button><div class="msg"></div></div>`;
  }

  function disputePanel(state) {
    if (!state) return { badge: "", panel: "", disputed: false, resolved: false };
    const p = state.payload;
    const resolved = state.kind === "dispute_resolved" || p.status === "RESOLVED";
    const badge = resolved ? '<span class="badge neutral">Dispute resolved</span>'
                           : '<span class="badge bad">Disputed</span>';
    const panel = `<div class="dispute${resolved ? " resolved" : ""}">
        <strong>${esc(humanize(p.reason))}</strong> · ${esc(money(p.dispute_amount))}
        <div class="muted">Status: ${esc(p.status || "?")}${p.dispute_life_cycle_stage ? ` · Stage: ${esc(p.dispute_life_cycle_stage)}` : ""} · Case ${esc(p.dispute_id)}</div>
        ${resolved ? "" : respondBy(p.seller_response_due_date)}
        ${p.enrichment_error ? '<div class="muted">Could not load full dispute details from PayPal.</div>' : ""}
        ${sandboxTool(state)}
      </div>`;
    return { badge, panel, disputed: !resolved, resolved };
  }

  // The server stores which decisions PayPal currently allows with every dispute snapshot
  // (same rules it checks before each step). Older rows lack it: let the server decide.
  const actionAllowed = (decision, p) => !p.allowed_decisions || p.allowed_decisions.includes(decision);

  // One line per Approve click: "Evidence sent ✓ · Message skipped (dispute is waiting for the buyer)".
  function actionRuns(actions) {
    const runs = [];
    for (const e of actions) {
      const key = e.payload.run_id || `${e.created_at}`;
      let run = runs.find((r) => r.key === key);
      if (!run) runs.push(run = { key, at: e.created_at, action: e.payload.action, steps: [] });
      run.steps.push(e);
    }
    const step = (e) => {
      const name = esc(STEP_NAMES[e.payload.endpoint] || e.payload.endpoint);
      if (e.kind === "dispute_action_sent") return `<span class="ok">${name} sent ✓</span>`;
      if (e.kind === "dispute_action_skipped") return `<span class="muted">${name} skipped (${esc(e.payload.reason)})</span>${techHtml(errorParts(e.payload).tech)}`;
      return `<span class="bad">${name} failed (${errorHtml(e.payload)})</span>`;
    };
    return runs.map((r) => `<li>${esc(DECISIONS[r.action] || r.action)}: ${r.steps.map(step).join(" · ")} <span class="muted">${fmt(r.at)}</span></li>`).join("");
  }

  // Why the seller can't act right now (null = some decision is allowed).
  function noActionReason(p, resolved) {
    if (resolved) return "Dispute resolved";
    if (p.status === "WAITING_FOR_BUYER_RESPONSE") return "Waiting for the buyer, nothing to send right now";
    if (p.allowed_decisions && !p.allowed_decisions.length)
      return p.status === "UNDER_REVIEW" ? "PayPal is reviewing this case" : "PayPal allows no seller action right now";
    return null;
  }

  function aiCard(events, state, resolved) {
    if (!state) return "";
    const id = state.payload.dispute_id;
    const mine = events.filter((e) => e.payload.dispute_id === id);
    const ai = mine.filter((e) => e.kind === "ai_recommendation" || e.kind === "ai_failed").pop();
    const actions = mine.filter((e) => ["dispute_action_sent", "dispute_action_failed", "dispute_action_skipped"].includes(e.kind));
    const results = actions.length ? `<label>Sent to PayPal</label><ul>${actionRuns(actions)}</ul>` : "";
    const regen = resolved ? "" : `<button class="secondary" data-regen="${esc(id)}">Regenerate</button>`;

    // Nothing to approve: one line instead of editable drafts.
    const blocked = noActionReason(state.payload, resolved);
    if (blocked) {
      const r = ai?.kind === "ai_recommendation" ? ai.payload.recommendation : null;
      const last = r ? `Last AI suggestion: ${DECISIONS[r.decision]}, ${Math.round(r.confidence * 100)}%` : "No AI suggestion";
      return `<div class="ai compact"><span>${esc(last)} · ${esc(blocked)}</span></div>`;
    }

    if (!ai) return `<div class="ai"><h3>AI recommendation</h3><div class="muted">None yet.</div>${results}<div class="row">${regen}</div><div class="msg"></div></div>`;
    if (ai.kind === "ai_failed") return `<div class="ai"><h3>AI recommendation</h3>
        <div class="bad">AI unavailable, try Regenerate.</div><div class="muted">${errorHtml(ai.payload)}</div>
        ${results}<div class="row">${regen}</div><div class="msg"></div></div>`;

    const p = ai.payload, r = p.recommendation;
    const label = p.provider === "groq" ? `AI: Groq ${p.model} (fallback)` : `AI: Gemini ${p.model}`;
    const reasons = r.reasons.map((x) => `<li>${esc(x.text)} <span class="muted">(${x.fact_keys.map(esc).join(", ") || "no facts cited"})</span></li>`).join("");
    const missing = r.missing_evidence.length ? `<label>Missing evidence</label><ul>${r.missing_evidence.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : "";
    const offer = r.offer ? `<label>Offer</label><div class="row">
        <input data-field="offer_type" value="${esc(r.offer.type)}" size="22" />
        <input data-field="offer_amount" type="number" step="0.01" min="0.01" value="${esc(r.offer.amount)}" /> ${esc(state.payload.dispute_amount?.currency_code || "")}</div>` : "";
    // Claim stage: PayPal needs a document the seller provides; Approve waits for the file.
    const docs = r.decision === "FIGHT" ? (state.payload.document_evidence || []) : [];
    const picker = docs.length ? `<label>Evidence document (PayPal needs one for this claim)</label>
        <div class="row"><select data-field="evidence_type">${docs.map((d) =>
          `<option value="${esc(d.type)}"${d.type === "PROOF_OF_DELIVERY_SIGNATURE" ? " selected" : ""}>${esc(d.label)}</option>`).join("")}</select>
        <input type="file" data-field="evidence_file" accept=".pdf,.jpg,.jpeg,.png,.gif,application/pdf,image/jpeg,image/png,image/gif" /></div>
        <div class="muted">One PDF, JPG, PNG or GIF, at most 5 MB. Clearline only uploads files you provide; it never generates proof.</div>` : "";
    const approve = actionAllowed(r.decision, state.payload)
        ? `<button data-approve="${esc(id)}" data-decision="${esc(r.decision)}"${docs.length ? ' data-needs-file="1" disabled title="Attach a document first"' : ""}>Approve &amp; send</button>`
        : `<span class="muted">PayPal doesn't currently allow “${esc(DECISIONS[r.decision])}” on this dispute.</span>`;
    return `<div class="ai" data-dispute="${esc(id)}">
        <h3>AI recommendation <span class="badge ${esc(r.decision.toLowerCase())}">${esc(DECISIONS[r.decision])}</span>
          <span class="muted">confidence ${Math.round(r.confidence * 100)}% · ${esc(label)} · ${(p.latency_ms / 1000).toFixed(1)} s</span></h3>
        <ul>${reasons}</ul>${missing}${offer}
        <label>Message to buyer</label><textarea data-field="message_to_buyer">${esc(r.message_to_buyer)}</textarea>
        <label>Note to PayPal</label><textarea data-field="note_to_paypal">${esc(r.note_to_paypal)}</textarea>
        ${picker}
        ${results}
        <div class="row">${approve}${regen}</div><div class="msg"></div>
        <div class="muted">Nothing is sent to PayPal until you click Approve.</div>
      </div>`;
  }

  const getTimeline = async (id) => (await fetch(`/api/orders/${encodeURIComponent(id)}/timeline`)).json();
  const isSide = (id) => id === "other" || id.startsWith("unmatched:");
  const PAYPAL_FAILURE_KINDS = ["dispute_action_failed", "dispute_action_skipped", "sandbox_status_change_failed", "refund_failed"];
  const row = (e, extra = "") =>
    `<li>${esc(LABELS[e.kind] || e.kind)} <span class="muted">${esc(describe(e))} · ${fmt(e.created_at)}</span>${
      PAYPAL_FAILURE_KINDS.includes(e.kind) ? techHtml(errorParts(e.payload).tech) : ""}${extra}</li>`;

  // Timeline rows, keeping only the latest AI recommendation per dispute in place; earlier
  // ones fold into "(+N earlier)" on that row.
  function timelineRows(events) {
    const recs = {};
    events.filter((e) => e.kind === "ai_recommendation")
      .forEach((e) => (recs[e.payload.dispute_id] ||= []).push(e));
    return events.map((e) => {
      if (e.kind !== "ai_recommendation") return row(e);
      const list = recs[e.payload.dispute_id];
      if (e !== list[list.length - 1]) return "";
      const earlier = list.slice(0, -1);
      return row(e, earlier.length ? `<details class="earlier"><summary>(+${earlier.length} earlier)</summary><ul>${earlier.map((x) => row(x)).join("")}</ul></details>` : "");
    }).join("");
  }

  // The buyer's side of an order: their private link, their requests (with a reply box) and,
  // for refund requests, the refund buttons. Only the seller's click sends a refund.
  function buyerSection(orderId, b) {
    if (!b) return "";
    const link = `${location.origin}${b.link}`;
    const canRefund = Number(b.refundable) > 0;
    const requests = b.requests.map((r) => `<div class="req">
        <strong>${esc(BUYER_TYPES[r.type] || r.type)}</strong>${r.reason ? ` · ${esc(r.reason)}` : ""} <span class="muted">· ${fmt(r.at)}</span>
        ${r.message ? `<div>${esc(r.message)}</div>` : '<div class="muted">(no message)</div>'}
        ${r.replies.map((x) => `<div class="reply">You: ${esc(x.message)}</div>`).join("")}
        <textarea data-reply-text placeholder="Reply to the buyer (shown on their order page)" maxlength="1000"></textarea>
        <div class="row">
          <button class="secondary" data-reply="${esc(r.id)}" data-order="${esc(orderId)}">Send reply</button>
          ${r.type === "refund" && canRefund ? `
            <button data-refund="full" data-request="${esc(r.id)}" data-order="${esc(orderId)}" data-max="${esc(b.refundable)}" data-currency="${esc(b.currency)}">Refund full amount (${esc(b.refundable)} ${esc(b.currency)})</button>
            <button class="secondary" data-refund="partial" data-request="${esc(r.id)}" data-order="${esc(orderId)}" data-max="${esc(b.refundable)}" data-currency="${esc(b.currency)}">Refund partial…</button>` : ""}
        </div><div class="msg"></div></div>`).join("");
    const refunds = b.refunds.map((x) => `<div class="ok">Refund of ${esc(x.amount)} ${esc(x.currency)} sent${x.status && x.status !== "COMPLETED" ? ` (${esc(x.status)})` : ""} · ${fmt(x.at)}</div>`).join("");
    return `<div class="buyer">
        <div class="muted">Buyer page: <a href="${esc(link)}" target="_blank" rel="noopener">${esc(b.link.slice(0, 14))}…</a>
          <button class="secondary" data-copy="${esc(link)}">Copy link</button></div>
        ${refunds}
        ${b.requests.length ? `<h4>Buyer requests</h4>${requests}` : ""}
      </div>`;
  }

  async function loadStats() {
    const res = await fetch("/api/stats");
    if (!res.ok) return;
    const s = await res.json(), el = document.getElementById("stats");
    el.innerHTML = `Questions answered before a dispute: <strong>${esc(s.questions_answered_before_dispute)}</strong>`;
    el.hidden = false;
  }

  async function render() {
    const all = await (await fetch("/api/orders")).json();
    const orders = all.filter((o) => !isSide(o.order_id));
    const root = document.getElementById("orders");
    renderOther(all.filter((o) => isSide(o.order_id)));
    if (!orders.length) { root.innerHTML = '<p class="muted">No orders yet. Pay one on the checkout page.</p>'; return; }
    const blocks = await Promise.all(orders.map(async (o) => {
      const events = await getTimeline(o.order_id);
      const state = currentDispute(events);
      const d = disputePanel(state);
      const captured = events.some((e) => e.kind === "payment_captured");
      const tracked = events.some((e) => e.kind === "tracking_added");
      const buyer = captured ? await (await fetch(`/api/orders/${encodeURIComponent(o.order_id)}/buyer`)).json().catch(() => null) : null;
      const steps = timelineRows(events);
      const form = captured && !tracked ? `
        <form data-order="${esc(o.order_id)}">
          <input name="tracking_number" placeholder="Tracking number" required />
          <select name="carrier"><option>DHL</option><option>FEDEX</option><option>UPS</option><option>USPS</option></select>
          <button>Mark shipped</button>
        </form><div class="msg"></div>` : "";
      return `<div class="order${d.disputed ? " disputed" : ""}"><div class="id">${esc(o.order_id)}${d.badge}</div>${d.panel}${aiCard(events, state, d.resolved)}${buyerSection(o.order_id, buyer)}<ol>${steps}</ol>${form}</div>`;
    }));
    root.innerHTML = blocks.join("");
    root.querySelectorAll("form").forEach((f) => f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const button = f.querySelector("button");
      if (button.disabled) return; // already sending: a second click does nothing
      const msg = f.nextElementSibling;
      const data = Object.fromEntries(new FormData(f));
      button.disabled = true; button.textContent = "Saving…"; busy++;
      try {
        const res = await fetch(`/api/orders/${f.dataset.order}/tracking`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
        });
        if (res.ok) { await render(); } else { msg.textContent = `Failed: ${await res.text()}`; }
      } finally { busy--; button.disabled = false; button.textContent = "Mark shipped"; }
    }));
    root.querySelectorAll(".buyer textarea").forEach((el) =>
      el.addEventListener("input", () => { if (el.value) el.dataset.dirty = "1"; else delete el.dataset.dirty; }));
    root.querySelectorAll("[data-reply]").forEach((b) => b.addEventListener("click", () => sendReply(b)));
    root.querySelectorAll("[data-refund]").forEach((b) => b.addEventListener("click", () => refund(b)));
    root.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () =>
      navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "Copied ✓"; })));
    loadStats();
    root.querySelectorAll(".ai textarea, .ai input, .ai select").forEach((el) =>
      el.addEventListener("input", () => { el.dataset.dirty = "1"; }));
    root.querySelectorAll('[data-field="evidence_file"]').forEach((input) =>
      input.addEventListener("change", () => fileChosen(input)));
    root.querySelectorAll("[data-regen]").forEach((b) => b.addEventListener("click", () => regenerate(b)));
    root.querySelectorAll("[data-approve]").forEach((b) => b.addEventListener("click", () => approve(b)));
    root.querySelectorAll("[data-sandbox]").forEach((b) => b.addEventListener("click", () => sandboxRequireEvidence(b)));
    loadSyncStatus();
  }

  async function loadSyncStatus() {
    const el = document.getElementById("sync-status");
    try {
      const s = await (await fetch("/api/disputes/sync/status")).json();
      const auto = s.auto_sync_minutes > 0 ? `auto every ${s.auto_sync_minutes} min` : "auto-sync off";
      el.textContent = s.error ? `Last sync failed: ${s.error} (${auto})`
        : s.last_synced_at ? `Last synced: ${fmt(s.last_synced_at)} (${s.trigger}) · ${auto}`
        : `Not synced yet · ${auto}`;
    } catch { el.textContent = ""; }
  }

  // Sandbox-only test tool; the server refuses it (404) in live mode as well.
  function sandboxRequireEvidence(button) {
    if (!confirm("SANDBOX TEST TOOL: ask PayPal's Sandbox to move this dispute from UNDER_REVIEW to waiting for the seller's evidence?")) return;
    return withBusy(button, "Asking PayPal Sandbox…", async () => {
      const res = await fetch(`/api/disputes/${encodeURIComponent(button.dataset.sandbox)}/sandbox/require-seller-evidence`, { method: "POST" });
      if (!res.ok) throw new Error(await errorText(res));
      await render();
    });
  }

  function sendReply(button) {
    const box = button.closest(".req").querySelector("[data-reply-text]");
    const message = box.value.trim();
    if (!message) { box.focus(); return; }
    return withBusy(button, "Sending…", async () => {
      const res = await fetch(`/api/orders/${encodeURIComponent(button.dataset.order)}/requests/${encodeURIComponent(button.dataset.reply)}/reply`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message }),
      });
      if (!res.ok) throw new Error(`Reply failed: ${await errorText(res)}`);
      delete box.dataset.dirty; box.value = "";
      await render();
    });
  }

  // Refunds move money: always ask first, and let the server check the amount again.
  function refund(button) {
    const { order, request, max, currency } = button.dataset;
    let amount = max;
    if (button.dataset.refund === "partial") {
      amount = prompt(`Refund how much? (at most ${max} ${currency})`, "");
      if (amount === null) return;
      amount = amount.trim();
      if (!(Number(amount) > 0 && Number(amount) <= Number(max))) { alert(`Enter an amount between 0.01 and ${max}.`); return; }
    }
    if (!confirm(`Refund ${amount} ${currency} to the buyer through PayPal? This can't be undone.`)) return;
    return withBusy(button, "Refunding…", async () => {
      const body = button.dataset.refund === "full" ? { mode: "full", request_id: request }
        : { mode: "partial", amount, request_id: request };
      const res = await fetch(`/api/orders/${encodeURIComponent(order)}/refund`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) { await render(); throw new Error(`Refund not sent: ${await errorText(res)}`); }
      await render();
    });
  }

  async function withBusy(button, text, fn) {
    const card = button.closest(".ai, .sandbox-tool, .req"), msg = card.querySelector(".msg");
    const old = button.textContent;
    button.disabled = true; button.textContent = text; busy++;
    try { msg.textContent = (await fn()) || ""; msg.className = "msg"; }
    catch (err) { msg.textContent = err.message; msg.className = "msg bad"; }
    finally { busy--; button.disabled = false; button.textContent = old; }
  }

  async function errorText(res) {
    const body = await res.json().catch(() => ({}));
    const d = body.detail;
    if (d?.summary) return d.summary;
    if (d?.paypal_status) return `PayPal returned HTTP ${d.paypal_status}${d.paypal_error?.name ? ` (${d.paypal_error.name})` : ""}`;
    return typeof d === "string" ? d : JSON.stringify(d || body);
  }

  function regenerate(button) {
    return withBusy(button, "Thinking…", async () => {
      const res = await fetch(`/api/disputes/${encodeURIComponent(button.dataset.regen)}/recommendation`, { method: "POST" });
      if (!res.ok) throw new Error(`Regenerate failed: ${await errorText(res)}`);
      await render();
    });
  }

  const MAX_FILE_BYTES = 5 * 1024 * 1024; // the server checks again (type by content, too)

  // Enable Approve only once a file is chosen; the server does the real checks.
  function fileChosen(input) {
    const card = input.closest(".ai"), button = card.querySelector("[data-approve]"), msg = card.querySelector(".msg");
    const file = input.files[0];
    input.dataset.dirty = "1";
    const tooBig = file && file.size > MAX_FILE_BYTES;
    if (button) button.disabled = !file || !file.size || tooBig;
    msg.textContent = tooBig ? "That file is too big: PayPal accepts files of at most 5 MB." : "";
    msg.className = tooBig ? "msg bad" : "msg";
  }

  const toBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.onerror = () => reject(new Error("Could not read the file. Please choose it again."));
    reader.readAsDataURL(file);
  });

  function approve(button) {
    const card = button.closest(".ai");
    const field = (name) => card.querySelector(`[data-field="${name}"]`)?.value?.trim();
    const decision = button.dataset.decision;
    const body = { action: decision, message_to_buyer: field("message_to_buyer"), note_to_paypal: field("note_to_paypal") };
    if (decision === "OFFER") body.offer = { type: field("offer_type"), amount: Number(field("offer_amount")) };
    const file = button.dataset.needsFile ? card.querySelector('[data-field="evidence_file"]')?.files[0] : null;
    if (button.dataset.needsFile && !file) return; // Approve stays disabled until a file is attached
    const typeLabel = card.querySelector('[data-field="evidence_type"]')?.selectedOptions[0]?.textContent;
    const what = file ? `send "${file.name}" to PayPal as "${typeLabel}" evidence, with your note to PayPal`
      : { FIGHT: "submit your tracking as proof of shipment (if PayPal allows it) and then message the buyer (if still allowed)",
          OFFER: `offer the buyer ${body.offer?.amount} (${body.offer?.type})`,
          REFUND: "accept the claim and refund the full disputed amount" }[decision];
    if (!confirm(`This will ${what}. Continue?`)) return;
    return withBusy(button, "Sending…", async () => {
      if (file) body.evidence = { type: field("evidence_type"), file_name: file.name, content_base64: await toBase64(file) };
      const res = await fetch(`/api/disputes/${encodeURIComponent(button.dataset.approve)}/act`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) { await render(); throw new Error(`PayPal: ${await errorText(res)}`); }
      await render();
    });
  }

  // Webhook events that didn't match one of our orders (e.g. Simulator mock data).
  async function renderOther(side) {
    const root = document.getElementById("other");
    if (!side.length) { root.innerHTML = ""; return; }
    const blocks = await Promise.all(side.map(async (o) => {
      const events = await getTimeline(o.order_id);
      return `<div class="order"><div class="id">${esc(o.order_id)}</div><ol>${timelineRows(events)}</ol></div>`;
    }));
    root.innerHTML = `<h2>Unmatched and other PayPal events</h2>${blocks.join("")}`;
  }

  document.getElementById("logout").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" }).catch(() => {});
    location.href = "/login";
  });

  document.getElementById("sync").addEventListener("click", async (ev) => {
    const button = ev.currentTarget, msg = document.getElementById("sync-msg");
    button.disabled = true; msg.textContent = "Syncing…"; busy++;
    try {
      const res = await fetch("/api/disputes/sync", { method: "POST" });
      const c = await res.json();
      msg.textContent = res.ok
        ? `${c.listed} on PayPal · ${c.new} new · ${c.changed} changed · ${c.unchanged} unchanged${c.failed ? ` · ${c.failed} failed` : ""}`
        : `Sync failed: ${JSON.stringify(c.detail || c)}`; // textContent: no HTML parsing
      await render();
    } catch (err) { msg.textContent = `Sync failed: ${err.message}`; }
    finally { busy--; button.disabled = false; }
  });

  // Refresh every 10s so new disputes appear, but never while the seller is typing, has
  // edited an AI draft, has a half-typed tracking number, or is waiting on a button.
  function typing() {
    const active = document.activeElement;
    if (active && active.closest("#orders") && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) return true;
    if (document.querySelector("#orders [data-dirty]")) return true;
    return busy > 0 || [...document.querySelectorAll("#orders form input")].some((i) => i.value);
  }

  fetch("/api/config").then((r) => r.json()).then((c) => { ENV = c.env; }).catch(() => {}).finally(render);
  setInterval(() => { if (!typing()) render().catch(() => {}); }, 10000);
</script>
</body>
</html>

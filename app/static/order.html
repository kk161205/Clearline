<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Your order</title>
  <link rel="preload" href="/static/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/ui.css" />
  <script src="/static/ui.js"></script>
  <style>
    body { font-size: 1rem; }
    main { max-width: 560px; margin: 0 auto; padding: 20px var(--gutter) 48px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    .hero h1 { font-size: var(--t-xl); margin: 6px 0 10px; }
    @media (min-width: 640px) { .hero h1 { font-size: var(--t-2xl); } main { padding-top: 32px; } }
    .ref { color: var(--muted); font-size: var(--t-sm); }
    .summary { color: var(--muted); margin: 0 0 16px; }
    .who { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-block: 1px solid var(--border); }
    .who .seller { font-weight: 600; }
    .who .amount { font-size: var(--t-lg); font-weight: 650; }
    .block { margin-top: 32px; }
    .block > h2 { font-size: var(--t-md); margin-bottom: 14px; }
    .cl .kv { margin-top: 6px; grid-template-columns: max-content minmax(0, 1fr); }
    .tracking { display: flex; align-items: center; gap: 4px; }
    .tracking .num { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .tracking button { flex: none; }
    .help { display: grid; gap: 10px; }
    .help-btn {
      width: 100%; justify-content: flex-start; text-align: left; min-height: 60px; padding: 14px 16px;
      background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); border-radius: var(--r-lg); font-size: 1rem;
    }
    .help-btn:hover { filter: none; background: var(--surface-2); }
    .help-btn[aria-expanded="true"] { border-color: var(--ink); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .help-btn .chev { margin-left: auto; transition: transform .15s; }
    .help-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .help-panel { border: 1px solid var(--ink); border-top: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 16px; margin-top: -10px; background: var(--surface); }
    .help-panel textarea, .help-panel select { width: 100%; margin-top: 8px; }
    .help-panel .actions button { width: 100%; }
    .notice { color: var(--settled-ink); margin-top: 12px; font-weight: 500; }
    .error { color: var(--disputed-ink); margin-top: 8px; min-height: 1.5em; }
    .error:empty { min-height: 0; margin: 0; }
    .convo { display: grid; gap: 12px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: var(--r-lg); }
    .msg .who-line { font-size: var(--t-xs); color: var(--muted); margin-bottom: 2px; }
    .msg.me { justify-self: end; background: var(--surface-2); border-bottom-right-radius: 4px; }
    .msg.them { justify-self: start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.money { justify-self: start; background: var(--settled-tint); color: var(--settled-ink); font-weight: 600; }
    .msg.wait { justify-self: start; color: var(--muted); font-size: var(--t-sm); padding: 0 4px; }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: var(--t-xs); }
  </style>
</head>
<body>
<div class="demo-banner"><strong>PayPal Sandbox demo:</strong> test accounts only, no real money.</div>
<main>
  <div class="top"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>Clearline</span></div>
  <div id="root" aria-live="polite">
    <span class="skeleton" style="height:1.2em;width:40%"></span>
    <span class="skeleton" style="height:2em;width:85%;margin-top:12px"></span>
    <span class="skeleton row" style="margin-top:24px;height:180px"></span>
  </div>
  <footer><span>This page is private to you. Keep the link to come back.</span>
    <button class="ghost small" data-theme-toggle aria-pressed="false">Theme</button></footer>
</main>

<script src="/static/pages/order.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearline · Checkout</title>
  <style>
    :root { --ink:#14213d; --muted:#5c6475; --line:#e3e6ec; --bg:#f6f7f9; --ok:#1a7f4b; --bad:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width:480px; margin:48px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; }
    h1 { font-size:20px; margin:0 0 4px; }
    .muted { color:var(--muted); font-size:14px; }
    .price { font-size:28px; font-weight:600; margin:16px 0; }
    #result { margin-top:16px; font-size:14px; min-height:1.5em; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    .paid { border:1px solid #b7e1c8; background:#effaf3; color:var(--ok); border-radius:10px; padding:14px 16px; }
    .paid p { margin:6px 0 10px; color:var(--ink); font-size:14px; }
    .paid a { color:var(--ok); font-size:14px; }
    .mono { font-family:ui-monospace, monospace; font-size:13px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <p class="muted">Sandbox demo · sold by an India-based studio</p>
    <h1 id="item-name">Loading…</h1>
    <div class="price" id="item-price"></div>
    <paypal-button hidden></paypal-button>
    <div id="paid" class="paid" hidden>
      <strong>Payment received ✓</strong>
      <p>Order <span id="paid-order" class="mono"></span> is confirmed. The seller has been notified.</p>
      <a href="/">Buy another</a>
    </div>
    <div id="result"></div>
  </div>
</main>

<script>
  const ITEM_ID = "brand-kit";
  const result = document.getElementById("result");
  const show = (text, cls = "") => { result.textContent = text; result.className = cls; };

  // Replace the button with a confirmation and keep the order ID in the URL,
  // so the paid state survives a refresh or coming back to the tab.
  function showPaid(orderId) {
    document.querySelector("paypal-button")?.setAttribute("hidden", "");
    document.getElementById("paid-order").textContent = orderId;
    document.getElementById("paid").hidden = false;
    show("");
    history.replaceState(null, "", `/?order=${encodeURIComponent(orderId)}`);
  }

  async function restorePaidState() {
    const orderId = new URLSearchParams(location.search).get("order");
    if (!orderId) return false;
    const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/timeline`);
    if (!res.ok) return false;
    const events = await res.json();
    if (!events.some((e) => e.kind === "payment_captured")) return false;
    showPaid(orderId);
    return true;
  }

  async function createOrder() {
    const res = await fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item_id: ITEM_ID }),
    });
    if (!res.ok) throw new Error("Could not create order");
    return res.json(); // must resolve to { orderId }
  }

  async function init() {
    const config = await (await fetch("/api/config")).json();
    const item = config.catalogue[ITEM_ID];
    document.getElementById("item-name").textContent = item.description;
    document.getElementById("item-price").textContent = `$${item.amount} ${item.currency}`;
    if (await restorePaidState()) return; // already paid: don't load the button

    const script = document.createElement("script");
    script.src = config.sdkUrl;
    script.onload = async () => {
      const sdk = await window.paypal.createInstance({
        clientId: config.clientId,
        components: ["paypal-payments"],
        pageType: "checkout",
      });
      const button = document.querySelector("paypal-button");
      button.addEventListener("click", async () => {
        const session = sdk.createPayPalOneTimePaymentSession({
          onApprove: async (data) => {
            show("Capturing payment…");
            const res = await fetch(`/api/orders/${data.orderId}/capture`, { method: "POST" });
            const body = await res.json();
            if (res.ok && body.status === "COMPLETED") {
              showPaid(data.orderId);
            } else {
              show(`Capture problem: ${JSON.stringify(body)}`, "bad");
            }
          },
          onCancel: () => show("Payment cancelled."),
          onError: (err) => show(`PayPal error: ${err?.message || err}`, "bad"),
        });
        try {
          await session.start({ presentationMode: "auto" }, createOrder());
        } catch (err) {
          show(err.message, "bad");
        }
      });
      button.removeAttribute("hidden");
    };
    script.onerror = () => show("Could not load the PayPal SDK.", "bad");
    document.head.appendChild(script);
  }

  init().catch((err) => show(err.message, "bad"));
</script>
</body>
</html>

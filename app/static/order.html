<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Your order</title>
  <link rel="preload" href="/static/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/ui.css" />
  <script src="/static/ui.js"></script>
  <style>
    body { font-size: 1rem; }
    main { max-width: 560px; margin: 0 auto; padding: 20px var(--gutter) 48px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    .hero h1 { font-size: var(--t-xl); margin: 6px 0 10px; }
    @media (min-width: 640px) { .hero h1 { font-size: var(--t-2xl); } main { padding-top: 32px; } }
    .ref { color: var(--muted); font-size: var(--t-sm); }
    .summary { color: var(--muted); margin: 0 0 16px; }
    .who { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-block: 1px solid var(--border); }
    .who .seller { font-weight: 600; }
    .who .amount { font-size: var(--t-lg); font-weight: 650; }
    .block { margin-top: 32px; }
    .block > h2 { font-size: var(--t-md); margin-bottom: 14px; }
    .cl .kv { margin-top: 6px; grid-template-columns: max-content minmax(0, 1fr); }
    .tracking { display: flex; align-items: center; gap: 4px; }
    .tracking .num { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .tracking button { flex: none; }
    .help { display: grid; gap: 10px; }
    .help-btn {
      width: 100%; justify-content: flex-start; text-align: left; min-height: 60px; padding: 14px 16px;
      background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); border-radius: var(--r-lg); font-size: 1rem;
    }
    .help-btn:hover { filter: none; background: var(--surface-2); }
    .help-btn[aria-expanded="true"] { border-color: var(--ink); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .help-btn .chev { margin-left: auto; transition: transform .15s; }
    .help-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .help-panel { border: 1px solid var(--ink); border-top: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 16px; margin-top: -10px; background: var(--surface); }
    .help-panel textarea, .help-panel select { width: 100%; margin-top: 8px; }
    .help-panel .actions button { width: 100%; }
    .notice { color: var(--settled-ink); margin-top: 12px; font-weight: 500; }
    .error { color: var(--disputed-ink); margin-top: 8px; min-height: 1.5em; }
    .error:empty { min-height: 0; margin: 0; }
    .convo { display: grid; gap: 12px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: var(--r-lg); }
    .msg .who-line { font-size: var(--t-xs); color: var(--muted); margin-bottom: 2px; }
    .msg.me { justify-self: end; background: var(--surface-2); border-bottom-right-radius: 4px; }
    .msg.them { justify-self: start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.money { justify-self: start; background: var(--settled-tint); color: var(--settled-ink); font-weight: 600; }
    .msg.wait { justify-self: start; color: var(--muted); font-size: var(--t-sm); padding: 0 4px; }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: var(--t-xs); }
  </style>
</head>
<body>
<main>
  <div class="top"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>Clearline</span></div>
  <div id="root" aria-live="polite">
    <span class="skeleton" style="height:1.2em;width:40%"></span>
    <span class="skeleton" style="height:2em;width:85%;margin-top:12px"></span>
    <span class="skeleton row" style="margin-top:24px;height:180px"></span>
  </div>
  <footer><span>This page is private to you. Keep the link to come back.</span>
    <button class="ghost small" data-theme-toggle aria-pressed="false">Theme</button></footer>
</main>

<script>
  const esc = UI.esc;
  const day = UI.date; // "27 Oct"; the year only when it isn't this year
  const token = location.pathname.split("/").pop();
  let data = null, open = null, notice = "", busy = false;
  const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  const refunded = (d) => d.refunds.reduce((sum, r) => sum + Number(r.amount || 0), 0);
  const fullyRefunded = (d) => d.amount && refunded(d) >= Number(d.amount) - 0.005;
  const refundDone = (r) => !r.status || r.status === "COMPLETED";
  const refundText = (r) => `Refund of ${r.amount} ${r.currency} ${refundDone(r) ? "sent" : "is being processed"}`;

  // One plain sentence: what is this, where is it. Never a delivery date we don't know.
  function headline(d) {
    const s = d.shipping;
    if (fullyRefunded(d)) return `Refunded in full on ${day(d.refunds[d.refunds.length - 1].at)}`;
    if (d.kind === "invoice") return d.paid_on ? `Invoice paid on ${UI.shortDay(d.paid_on)}` : "Invoice paid";
    if (s && s.shipped) return `Shipped with ${UI.word("carrier", s.carrier)}${s.shipped_on ? ` on ${UI.shortDay(s.shipped_on)}` : ""}`;
    return "Paid, not shipped yet";
  }

  function shippingHtml(s) {
    if (!s.shipped) return `<p>Not shipped yet. The seller adds tracking as soon as it ships.</p>`;
    return `<dl class="kv"><dt>Carrier</dt><dd>${esc(UI.word("carrier", s.carrier))}</dd>
      <dt>Tracking number</dt><dd class="tracking"><span class="num">${esc(s.tracking_number)}</span>
        <button class="ghost small" data-copy="${esc(s.tracking_number)}" aria-label="Copy tracking number">Copy</button></dd></dl>`;
  }

  // The clear line: Paid, Shipped, refunds, then the next expected step as a dashed stop
  // (never with a date: we don't know one). It turns amber from a refund still processing.
  function line(d) {
    const s = d.shipping;
    const stops = [{ key: "paid", tone: "settled", seg: "settled", title: "Paid", when: UI.shortDay(d.paid_on || ""),
                     detail: `<div class="cl-detail">Paid with PayPal</div>` }];
    if (s && s.shipped) stops.push({ key: "shipped", tone: "settled", seg: "settled", title: `Shipped with ${UI.word("carrier", s.carrier)}`,
                                     when: UI.shortDay(s.shipped_on || ""), detail: shippingHtml(s) });
    let held = false;
    d.refunds.forEach((r, i) => {
      held = held || !refundDone(r);
      stops.push({ key: `refund-${i}`, tone: refundDone(r) ? "settled" : "held", seg: held ? "held" : "settled",
                   title: refundText(r), when: day(r.at) });
    });
    if (s && !fullyRefunded(d))
      stops.push(s.shipped
        ? { key: "deliver-ahead", ahead: true, title: "Delivery not confirmed yet",
            detail: `<div class="cl-detail">Follow it with the tracking number above.</div>` }
        : { key: "ship-ahead", ahead: true, title: "Not shipped yet",
            detail: `<div class="cl-detail">The seller adds tracking as soon as it ships.</div>` });
    return UI.line("buyer", stops);
  }

  function panel(d, type) {
    const box = (placeholder) => `<textarea data-message placeholder="${esc(placeholder)}" maxlength="1000" aria-label="Message to the seller"></textarea>`;
    if (type === "unrecognised") return `<div class="help-panel" id="panel-${type}">
        <p>${esc(d.charge_explanation)}</p>
        <p class="muted">Still not right? Contact the seller:</p>
        ${box("Tell the seller what looks wrong")}
        <div class="actions"><button data-send="unrecognised">Send to the seller</button></div></div>`;
    if (type === "not_arrived") return `<div class="help-panel" id="panel-${type}">
        ${shippingHtml(d.shipping)}
        ${box("Anything the seller should know? For example, what you see on the tracking page")}
        <div class="actions"><button data-send="not_arrived">Send to the seller</button></div></div>`;
    return `<div class="help-panel" id="panel-${type}">
        <label class="field" for="reason">Reason
        <select id="reason" data-reason><option value="">Choose a reason</option>
          ${Object.entries(d.refund_reasons).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join("")}</select></label>
        ${box("Add details for the seller (optional)")}
        <div class="actions"><button data-send="refund">Ask the seller for a refund</button></div></div>`;
  }

  // The buyer's requests, the seller's replies and refunds, oldest first.
  function conversation(d) {
    const items = [];
    d.requests.forEach((r) => {
      items.push({ at: r.at, html: `<div class="msg me"><div class="who-line">You, ${esc(day(r.at))}</div>
        <strong>${esc(r.type_label)}</strong>${r.reason ? `<div>${esc(r.reason)}</div>` : ""}${r.message ? `<div>${esc(r.message)}</div>` : ""}</div>` });
      r.replies.forEach((x) => items.push({ at: x.at, html: `<div class="msg them"><div class="who-line">${esc(d.seller)}</div>${esc(x.message)}</div>` }));
      if (!r.replies.length) items.push({ at: r.at + 0.001, html: `<div class="msg wait">Waiting for the seller's reply.</div>` });
    });
    d.refunds.forEach((r) => items.push({ at: r.at, html: `<div class="msg money">${esc(refundText(r))}</div>` }));
    return items.sort((a, b) => a.at - b.at).map((x) => x.html).join("");
  }

  // Pure: page HTML for the API data. Every value from the server is escaped.
  function view(d, openType = null, msg = "") {
    const help = Object.entries(d.request_types).map(([type, label]) =>
      `<button class="help-btn" data-open="${esc(type)}" aria-expanded="${openType === type}" aria-controls="panel-${esc(type)}">${esc(label)}${CHEV}</button>${openType === type ? panel(d, type) : ""}`).join("");
    const talk = d.requests.length || d.refunds.length;
    return `<section class="hero">
        <div class="ref">${d.kind === "invoice" ? "Invoice" : "Order"} …${esc(d.order_ref)}</div>
        <h1>${esc(headline(d))}</h1>
        <p class="summary" data-source="${esc(d.summary.source)}">${esc(d.summary.text)}</p>
        <div class="who"><div><div class="seller">${esc(d.seller)}</div><div class="muted">${esc(d.item)}</div></div>
          <div class="amount num">${esc(d.amount)} ${esc(d.currency)}</div></div>
      </section>
      <section class="block" aria-label="Order history">${line(d)}</section>
      <section class="block"><h2>Need help?</h2><div class="help">${help}</div>
        ${msg ? `<div class="notice" role="status">${esc(msg)}</div>` : ""}<div class="error" role="alert"></div></section>
      ${talk ? `<section class="block"><h2>Your messages</h2><div class="convo">${conversation(d)}</div></section>` : ""}`;
  }

  function draw() {
    const root = document.getElementById("root");
    root.innerHTML = view(data, open, notice);
    root.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => {
      open = open === b.dataset.open ? null : b.dataset.open; notice = ""; draw();
      if (open) document.querySelector(`#panel-${open} textarea, #panel-${open} select`)?.focus();
    }));
    root.querySelectorAll("[data-send]").forEach((b) => b.addEventListener("click", () => send(b)));
  }

  async function send(button) {
    const card = button.closest(".block"), error = card.querySelector(".error");
    const body = { type: button.dataset.send, message: card.querySelector("[data-message]")?.value || "" };
    if (body.type === "refund") {
      body.reason = card.querySelector("[data-reason]")?.value || null;
      if (!body.reason) { error.textContent = "Please choose a reason."; return; }
    }
    button.disabled = true; busy = true; error.textContent = "";
    try {
      const res = await fetch(`/api/o/${encodeURIComponent(token)}/requests`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { error.textContent = out.detail || "Something went wrong. Please try again."; return; }
      open = null; notice = "Sent. The seller will reply here.";
      await load();
    } catch { error.textContent = "Could not reach the seller's site. Please try again."; }
    finally { busy = false; button.disabled = false; }
  }

  async function load() {
    const res = await fetch(`/api/o/${encodeURIComponent(token)}`);
    if (!res.ok) { document.getElementById("root").innerHTML = '<div class="empty"><strong>Order not found</strong>Check the link in your confirmation.</div>'; return; }
    data = await res.json();
    draw();
  }

  // Pick up seller replies and refunds, but never while the buyer is typing or sending.
  const typing = () => busy || [...document.querySelectorAll("textarea, select")].some((el) => el.value);
  load();
  setInterval(() => { if (data && !typing()) load().catch(() => {}); }, 20000);
</script>
</body>
</html>
